<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - PraxisFit</title>
    <script src="assets/js/theme.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-zinc-900 text-slate-800 dark:text-zinc-300 font-sans transition-colors duration-300">
    
    <!-- Theme Toggle Corner -->
    <div class="absolute top-6 right-6 z-50">
        <button onclick="toggleTheme()" class="text-xl p-3 bg-white dark:bg-zinc-800 rounded-full shadow-md hover:shadow-lg transition-all" aria-label="Toggle Dark Mode">
            <span class="dark:hidden">🌙</span>
            <span class="hidden dark:inline">☀️</span>
        </button>
    </div>

    <div class="flex justify-center items-center min-h-screen px-4 py-12">
        <div class="bg-white dark:bg-zinc-800 p-8 rounded-2xl shadow-lg border border-gray-100 dark:border-zinc-700 w-96 transition-colors duration-300">
            <h2 class="text-2xl font-extrabold mb-2 text-center text-red-600 dark:text-lime-400 transition-colors duration-300">
                Daftar Akun Baru
            </h2>
            <p class="text-center text-sm text-gray-500 dark:text-zinc-400 mb-6">Mulai perjalanan fitness Anda hari ini.</p>
          
            <!-- Error Alert Container -->
            <div id="error-alert" class="hidden mb-4 p-3.5 bg-red-50 dark:bg-red-900/30 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-300 rounded-xl text-sm font-medium transition-all flex items-start space-x-2">
                <span class="text-lg leading-none">⚠️</span>
                <div id="error-message" class="flex-1"></div>
            </div>

            <!-- Success Alert Container -->
            <div id="success-alert" class="hidden mb-4 p-3.5 bg-emerald-50 dark:bg-lime-900/30 border border-emerald-200 dark:border-lime-700 text-emerald-700 dark:text-lime-300 rounded-xl text-sm font-medium transition-all flex items-start space-x-2">
                <span class="text-lg leading-none">✅</span>
                <div id="success-message" class="flex-1"></div>
            </div>

            <form id="register-form" class="space-y-4">
                <div>
                    <input 
                        id="name-input"
                        name="name"
                        type="text" 
                        placeholder="Nama Lengkap" 
                        autocomplete="name"
                        class="w-full p-3 border border-gray-200 dark:border-zinc-600 rounded-xl focus:ring-2 focus:ring-red-500 dark:focus:ring-lime-400 outline-none bg-gray-50 dark:bg-zinc-900 text-slate-800 dark:text-white transition-colors duration-300" 
                        required
                    >
                </div>
                
                <div>
                    <input 
                        id="email-input"
                        name="email"
                        type="email" 
                        placeholder="Alamat Email" 
                        autocomplete="email"
                        class="w-full p-3 border border-gray-200 dark:border-zinc-600 rounded-xl focus:ring-2 focus:ring-red-500 dark:focus:ring-lime-400 outline-none bg-gray-50 dark:bg-zinc-900 text-slate-800 dark:text-white transition-colors duration-300" 
                        required
                    >
                </div>
                
                <div>
                    <input 
                        id="password-input"
                        name="password"
                        type="password" 
                        placeholder="Password (minimal 8 karakter)" 
                        autocomplete="new-password"
                        class="w-full p-3 border border-gray-200 dark:border-zinc-600 rounded-xl focus:ring-2 focus:ring-red-500 dark:focus:ring-lime-400 outline-none bg-gray-50 dark:bg-zinc-900 text-slate-800 dark:text-white transition-colors duration-300" 
                        required
                        minlength="8"
                    >
                </div>

                <div>
                    <input 
                        id="confirm-password-input"
                        name="password_confirmation"
                        type="password" 
                        placeholder="Konfirmasi Password" 
                        autocomplete="new-password"
                        class="w-full p-3 border border-gray-200 dark:border-zinc-600 rounded-xl focus:ring-2 focus:ring-red-500 dark:focus:ring-lime-400 outline-none bg-gray-50 dark:bg-zinc-900 text-slate-800 dark:text-white transition-colors duration-300" 
                        required
                        minlength="8"
                    >
                </div>
                
                <button type="submit" id="submit-btn" class="w-full bg-red-600 dark:bg-lime-400 text-white dark:text-zinc-900 font-bold p-3 rounded-xl hover:bg-red-700 dark:hover:bg-lime-500 transition-all duration-300 shadow-md mt-2">
                    Buat Akun
                </button>
            </form>
    
            <div class="mt-6 text-center text-sm text-gray-500 dark:text-zinc-400">
                <span>Sudah punya akun?</span>
                <a href="login.html" class="text-red-600 dark:text-lime-400 font-bold hover:underline ml-1">
                    Login di sini
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/api.js"></script>
    <script src="assets/js/register.js"></script>
</body>
</html>
